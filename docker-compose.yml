services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathieulp-web
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ${APP_PATH}/dist:/usr/share/nginx/html:ro
      - ${APP_PATH}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
