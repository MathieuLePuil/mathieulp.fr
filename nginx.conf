server {
    listen 80;
    server_name mathieulp.fr mathieulp.localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Equivalent to Apache mod_deflate.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        image/svg+xml;

    # Long cache for versioned static assets.
    location ~* \.(css|js|png|webp|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # No-cache policy for HTML files.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA routing fallback (Apache RewriteRule to /index.html).
    location / {
        expires 30d;
        try_files $uri $uri/ /index.html;
    }
}
